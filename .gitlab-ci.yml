stages:
  - test

# Run pipelines only for merge requests and the master branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

variables:
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"

test:
  stage: test
  image: oven/bun:1
  cache:
    key:
      files: [bun.lock]
    paths: [.bun-cache/]
  script:
    - bun install --frozen-lockfile || bun install
    - bun run test:ci
  # Reads "Lines : xx.xx%" from the text-summary coverage output
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage/
      - junit.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
